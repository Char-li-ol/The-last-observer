<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Last Observer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
overflow:hidden;
height:100vh;
font-family:'Inter',sans-serif;
color:#f5eee8;
}

canvas{
position:fixed;
inset:0;
z-index:0;
}

.intro{
position:fixed;
inset:0;
z-index:9999;
overflow:hidden;
}

.door{
position:absolute;
top:0;
width:50%;
height:100%;
background:#050505;
display:flex;
align-items:center;
justify-content:center;
transition:transform 2.8s cubic-bezier(.77,0,.18,1);
}

.left-door{
left:0;
border-right:1px solid rgba(255,255,255,0.05);
}

.right-door{
right:0;
border-left:1px solid rgba(255,255,255,0.05);
}

.door-text{
font-family:'Inter',sans-serif;
font-size:13px;
letter-spacing:8px;
color:rgba(255,255,255,0.45);
white-space:nowrap;
}

.left-text{
transform:translateX(12px);
}

.right-text{
transform:translateX(-12px);
}

.intro.hide .left-door{
transform:translateX(-100%);
}

.intro.hide .right-door{
transform:translateX(100%);
}

.gallery{
position:relative;
width:100%;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:2;
opacity:0;
transition:opacity 2s ease;
}

.gallery.show{
opacity:1;
}

.top-note{
position:absolute;
top:35px;
letter-spacing:8px;
font-size:11px;
opacity:0.35;
}

.glow{
position:absolute;
width:700px;
height:700px;
background:radial-gradient(circle,
rgba(255,180,220,0.18) 0%,
rgba(255,180,220,0.08) 35%,
transparent 70%);
filter:blur(40px);
animation:pulse 5s ease-in-out infinite;
z-index:1;
}

@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.08);}
}

.frame-wrap{
perspective:1800px;
z-index:5;
}

.frame{
width:340px;
max-width:85vw;
cursor:pointer;
padding:12px;
background:rgba(18,18,18,0.95);
border:1px solid rgba(255,255,255,0.08);
box-shadow:
0 0 50px rgba(255,180,220,0.1),
0 0 120px rgba(0,0,0,0.9),
inset 0 0 20px rgba(255,255,255,0.03);
backdrop-filter:blur(10px);
transform-style:preserve-3d;
animation:float 7s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:rotateY(-5deg) translateY(0px);}
50%{transform:rotateY(5deg) translateY(-12px);}
}

.frame img{
width:100%;
display:block;
filter:grayscale(100%) contrast(105%) brightness(95%);
pointer-events:none;
}

.plaque{
margin-top:24px;
text-align:center;
z-index:5;
padding:0 20px;
}

.title{
font-family:'Cormorant Garamond',serif;
font-size:42px;
letter-spacing:5px;
margin-bottom:10px;
}

.medium{
font-family:'Cormorant Garamond',serif;
font-style:italic;
font-size:18px;
opacity:0.7;
margin-bottom:18px;
}

.desc{
line-height:1.8;
font-size:14px;
letter-spacing:1px;
opacity:0.85;
}

.signature{
margin-top:24px;
font-size:10px;
letter-spacing:5px;
opacity:0.35;
}

.whisper{
position:fixed;
font-family:'Cormorant Garamond',serif;
font-size:24px;
color:rgba(255,255,255,0.82);
pointer-events:none;
text-shadow:0 0 20px rgba(255,255,255,0.12);
z-index:99999;
opacity:0;
animation:fadeWhisper 4s ease forwards;
}

@keyframes fadeWhisper{
0%{
opacity:0;
transform:translateY(20px) rotate(-6deg) scale(0.96);
}
20%{opacity:0.95;}
80%{opacity:0.9;}
100%{
opacity:0;
transform:translateY(-35px) rotate(6deg) scale(1.02);
}
}

@media(max-width:600px){
.title{font-size:30px;}
.medium{font-size:16px;}
.desc{font-size:13px;}
.whisper{font-size:18px;}
}

</style>
</head>
<body>

<canvas id="dust"></canvas>

<div class="intro" id="intro">
  <div class="door left-door">
    <div class="door-text left-text">CURATOR</div>
  </div>
  <div class="door right-door">
    <div class="door-text right-text">ACCESS GRANTED</div>
  </div>
</div>

<div class="gallery" id="gallery">
  <div class="top-note">THE BEAKS DIGITAL EXHIBITION</div>
  <div class="glow"></div>
  <div class="frame-wrap">
    <div class="frame" id="frame">
      <img src="thelastobserver.jpg" alt="The Last Observer">
    </div>
  </div>
  <div class="plaque">
    <div class="title">THE LAST OBSERVER</div>
    <div class="medium">Graphite on Paper, 2026</div>
    <div class="desc">
      A creature that learned silence so well<br>
      it forgot its original voice.
    </div>
    <div class="signature">INSPIRED BY THEBEAKSART</div>
  </div>
</div>

<script>

/* DOORS */
const intro = document.getElementById('intro');
const gallery = document.getElementById('gallery');

setTimeout(() => {
  intro.classList.add('hide');
  gallery.classList.add('show');
}, 3000);

/* WHISPERS */
const frame = document.getElementById('frame');

const whispers = [
  'Some creatures evolve to survive.',
  'Others evolve to disappear.',
  'Silence eventually becomes identity.',
  'Observation changes the observer.',
  'Beauty can become a mask.'
];

let whisperIndex = 0;
let whisperActive = false;

function spawnWhisper() {
  if (whisperActive) return;
  whisperActive = true;

  const whisper = document.createElement('div');
  whisper.className = 'whisper';
  whisper.innerText = whispers[whisperIndex];

  whisper.style.left = Math.random() * 60 + 15 + '%';
  whisper.style.top = Math.random() * 60 + 15 + '%';

  document.body.appendChild(whisper);

  setTimeout(() => {
    whisper.remove();
    whisperActive = false;
  }, 4000);

  whisperIndex++;
  if (whisperIndex >= whispers.length) {
    whisperIndex = 0;
  }
}

frame.addEventListener('click', spawnWhisper);
frame.addEventListener('touchstart', (e) => {
  e.preventDefault();
  spawnWhisper();
});

/* DUST */
const canvas = document.getElementById('dust');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 160; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2,
    speed: (Math.random() * 0.5) + 0.1
  });
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    p.y += p.speed;
    if (p.y > canvas.height) {
      p.y = 0;
      p.x = Math.random() * canvas.width;
    }
  });
  requestAnimationFrame(animate);
}

animate();

</script>
</body>
</html>
